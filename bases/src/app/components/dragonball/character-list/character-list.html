<div class="col-12 col-sm-6">
  <h3>{{ listName() }}</h3>
  <ol>
    @for (character of characters(); track character.id) {
      @if (powerLevelNumber(character) > 500) {
        <li>
          <span>{{ character.name }}</span>
          -
          <span
            >nivel de poder:
            <strong [ngClass]="powerClasses(character.power)">{{ character.power }}</strong></span
          >
        </li>
      } @else {
        <li>Nah, no vale la pena... Se llama {{ character.name }} ...</li>
      }
    }
  </ol>
</div>
